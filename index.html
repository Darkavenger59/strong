<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-STRONG PRO</title>
    <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #F5F5F5; --text-muted: #8E8E93; --accent: #0A84FF; --danger: #FF453A; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding-bottom: 90px; }
        .view { display: none; padding: 20px; } .view.active { display: block; }
        .card { background: var(--card); padding: 18px; margin-bottom: 15px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-big { width: 160px; height: 160px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 24px; font-weight: 800; display: block; margin: 0 auto; }
        .heatmap { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 3px; width: max-content; margin: 20px auto; }
        .day { width: 12px; height: 12px; background-color: #161b22; border-radius: 2px; }
        .day[data-level="4"] { background-color: #39d353; }
        .serie-num { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; border: 1px solid #444; color: #666; font-size: 11px; margin-right: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #1a1a1a; display: flex; border-top: 1px solid #333; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); cursor: pointer; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <h1>B-STRONG</h1>
        <button class="btn-big" onclick="startWorkout()">GO</button>
        <div id="heatmap" class="heatmap"></div>
    </div>

    <div id="v-history" class="view"><h2>Historique</h2><div id="hist-list"></div></div>

    <div id="v-charts" class="view">
        <h2>Progression</h2>
        <div id="chart-list"></div>
    </div>

    <div id="v-workout" class="view">
        <input type="text" id="w-name" list="dl" placeholder="Mouvement">
        <div id="stats-apercu" style="margin: 10px 0; padding: 10px; background: #2C2C2E; border-radius: 10px; display: none; text-align: center;">
    <span style="font-size: 12px; color: var(--text-muted);">Progression aujourd'hui :</span><br>
    <b id="last-session-vol" style="color: var(--text-muted);">0</b> 
    <span style="color: var(--text-muted);">kg vs </span>
    <b id="current-session-vol" style="color: var(--accent);">0</b> 
    <span style="color: var(--text-muted);">kg</span>
</div>
        <datalist id="dl"></datalist>
        <div style="display:flex; gap:10px; margin: 10px 0;">
            <input type="number" id="w-kg" placeholder="kg">
            <input type="number" id="w-reps" placeholder="reps">
        </div>
        <button class="btn-action" style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:10px;" onclick="addSet()">Valider série</button>
        <ul id="w-list" style="list-style:none; padding:0;"></ul>
        <button class="btn-action" style="width:100%; padding:15px; background:var(--danger); color:white; border:none; border-radius:10px;" onclick="saveWorkout()">Terminer</button>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🏠 Accueil</div>
        <div class="nav-item" onclick="showTab('history', this)">📅 Historique</div>
        <div class="nav-item" onclick="showTab('charts', this)">📈 Graphiques</div>
        <div class="nav-item" onclick="startWorkout()">➕ Séance</div>
    </div>

<script>
        var currentSession = [], allData = [], stats = {}, myChart = null;
        firebase.initializeApp({ apiKey: "AIzaSyBuzNrrB-rK_xcjSeGtFc3I9yUKHhRUcIY", authDomain: "b-strong-4c3d1.firebaseapp.com", projectId: "b-strong-4c3d1", storageBucket: "b-strong-4c3d1.firebasestorage.app", messagingSenderId: "746501272062", appId: "1:746501272062:web:b2181766fd23ce8a3f10af" });
        var db = firebase.firestore();

        window.showTab = (n, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-'+n).classList.add('active');
            if(el) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
            if(n==='history') renderHistory();
            if(n==='charts') renderCharts();
        };
window.updateExerciseStats = function() {
    var name = document.getElementById('w-name').value.trim().toLowerCase();
    var container = document.getElementById('stats-apercu');
    
    if(!name) {
        container.style.display = 'none';
        return;
    }

    // 1. Calcul du volume total de la session EN COURS pour cet exercice
    var curVol = 0;
    currentSession.forEach(s => {
        if(s.nom.toLowerCase() === name) curVol += (s.poids * s.reps);
    });

    // 2. Trouver le volume total de la DERNIÈRE séance (regroupée par jour)
    // On trie par date décroissante pour trouver la séance la plus récente
    var sortedData = allData.sort((a, b) => b.date - a.date);
    var lastVol = 0;
    var lastDate = null;

    for (var item of sortedData) {
        var dayVol = 0;
        item.data.exercises.forEach(ex => {
            if(ex.nom.toLowerCase() === name) dayVol += (ex.poids * ex.reps);
        });

        // Si on trouve du volume sur un jour précédent
        if (dayVol > 0) {
            if (!lastDate) {
                lastDate = item.date.toDateString(); // On fixe la date de la séance trouvée
                lastVol = dayVol;
            } else if (item.date.toDateString() === lastDate) {
                // On additionne si c'est la même séance (regroupée par jour)
                lastVol += dayVol;
            } else {
                // On a trouvé une date antérieure, on s'arrête
                break;
            }
        }
    }

    // 3. Mise à jour de l'affichage
    document.getElementById('last-session-vol').innerText = lastVol + " kg";
    document.getElementById('current-session-vol').innerText = curVol + " kg";
    container.style.display = 'block';
};
        // --- GRAPHES LOGIQUE ---
        function renderCharts() {
            var div = document.getElementById('chart-list'); div.innerHTML = "";
            for(var k in stats) {
                var btn = document.createElement('div'); btn.className = 'card';
                btn.innerHTML = k.toUpperCase() + " ➔";
                btn.onclick = () => openChart(k);
                div.appendChild(btn);
            }
        }

        function openChart(key) {
            document.getElementById('modal').style.display='flex';
            
            // 1. Récupérer les données brutes
            var raw = stats[key] || [];
            
            // 2. Agréger par jour (Somme des volumes si plusieurs séries le même jour)
            var dailyVolumes = {};
            raw.forEach(item => {
                var dStr = item.date.toISOString().split('T')[0];
                if (!dailyVolumes[dStr]) dailyVolumes[dStr] = { date: item.date, vol: 0 };
                dailyVolumes[dStr].vol += item.vol;
            });

            // 3. Convertir en tableau trié
            var chartData = Object.values(dailyVolumes).sort((a,b) => a.date - b.date);

            var ctx = document.getElementById('myChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(x => x.date.toLocaleDateString('fr-FR', {day:'numeric', month:'short'})),
                    datasets: [{
                        label: 'Volume total journalier (kg)',
                        data: chartData.map(x => x.vol),
                        borderColor: '#0A84FF',
                        tension: 0.3,
                        fill: true,
                        backgroundColor: 'rgba(10, 132, 255, 0.1)'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        // --- RESTE DES FONCTIONS ---
        function renderHistory() {
            var div = document.getElementById('hist-list'); div.innerHTML = "";
            var groups = {};
            allData.forEach(item => {
                var dKey = item.date.toDateString();
                if(!groups[dKey]) groups[dKey] = {};
                item.data.exercises.forEach(ex => {
                    if(!groups[dKey][ex.nom]) groups[dKey][ex.nom] = [];
                    groups[dKey][ex.nom].push(ex);
                });
            });
            for(var date in groups) {
                var card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `<h3>${date}</h3>`;
                for(var exName in groups[date]) {
                    card.innerHTML += `<div style="font-weight:bold; margin-top:10px;">${exName}</div>`;
                    groups[date][exName].forEach((s, i) => card.innerHTML += `<div><span class="serie-num">${i+1}</span> ${s.poids}kg x ${s.reps}</div>`);
                }
                div.appendChild(card);
            }
        }

        function renderHeatmap() {
            var heatmap = document.getElementById('heatmap'); heatmap.innerHTML = '';
            for(var j=0; j<365; j++) {
                var d = new Date(); d.setDate(d.getDate() - 364 + j);
                var dStr = d.toISOString().split('T')[0];
                var c = document.createElement('div'); c.className = 'day';
                if(allData.some(i => i.date.toISOString().split('T')[0] === dStr)) c.dataset.level = "4";
                heatmap.appendChild(c);
            }
        }

        function loadData() { 
            db.collection("workouts").orderBy("date", "desc").get().then(snap => { 
                allData = []; stats = {};
                snap.forEach(doc => {
                    var d = doc.data();
                    var dateObj = d.date.toDate();
                    allData.push({data: d, date: dateObj});
                    d.exercises.forEach(ex => {
                        var k = ex.nom.toLowerCase();
                        if(!stats[k]) stats[k] = [];
                        stats[k].push({date: dateObj, vol: ex.poids * ex.reps});
                    });
                }); 
                renderHeatmap(); 
            }); 
        }

        window.startWorkout = () => showTab('workout');
        window.addSet = () => {
            var name = document.getElementById('w-name').value;
            currentSession.push({nom: name, poids: parseFloat(document.getElementById('w-kg').value), reps: parseInt(document.getElementById('w-reps').value)});
            document.getElementById('w-list').prepend(Object.assign(document.createElement('li'), {innerHTML: `<div class="card">${name} validé</div>`}));
        };
        window.saveWorkout = () => {
            db.collection("workouts").add({date: firebase.firestore.FieldValue.serverTimestamp(), exercises: currentSession}).then(() => {
                currentSession = []; loadData(); showTab('home');
            });
        };
        loadData();
    </script>
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; align-items:center; justify-content:center;" onclick="this.style.display='none'">
        <div class="card" style="width:90%; height:60%;"><canvas id="myChart"></canvas></div>
    </div>
</body>
</html>
