<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rééduc' Reveal</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { background: #2c3e50; color: white; font-family: 'Press Start 2P', monospace; display: flex; justify-content: center; height: 100vh; margin: 0; }
        #game { width: 400px; height: 500px; border: 4px solid #fff; position: relative; overflow: hidden; background: #34495e; }
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        button { background: #e74c3c; color: white; border: none; padding: 15px; margin: 10px; cursor: pointer; font-family: inherit; font-size: 10px; width: 250px; }
        #mystery-gift { cursor: pointer; font-size: 50px; margin-top: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

<div id="game">
    <!-- Menu Principal -->
    <div id="menu" class="screen">
        <h2>CHOISIS TON JOB</h2>
        <button onclick="lancerJeu('KINE')">KINÉ (Massage)</button>
        <button onclick="lancerJeu('ERGO')">ERGO (Fauteuil)</button>
        <button onclick="lancerJeu('EAPA')">EAPA (Parcours)</button>
    </div>

    <!-- Zone de Jeu -->
    <div id="game-zone" class="screen" style="display:none;">
        <h2 id="job-title">JOB</h2>
        <div id="action-area" style="font-size: 40px; margin: 20px;"></div>
        <p id="instruction" style="font-size: 10px;"></p>
    </div>

    <!-- Reveal -->
    <div id="reveal" class="screen" style="display:none;">
        <h2>BRAVO !</h2>
        <div id="mystery-gift" onclick="montrerSexe()">🎁</div>
        <p>Ouvre ton cadeau !</p>
    </div>
</div>

<script>
    let job = '';
    let score = 0;

    function lancerJeu(type) {
        job = type;
        score = 0;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-zone').style.display = 'flex';
        document.getElementById('job-title').innerText = job;
        
        let instr = job === 'KINE' ? "Clic pour masser !" : (job === 'ERGO' ? "Clic pour réparer !" : "Clic pour guider !");
        document.getElementById('instruction').innerText = instr;
        gameLoop();
    }

    function gameLoop() {
        let area = document.getElementById('action-area');
        area.innerHTML = job === 'KINE' ? "👵" : (job === 'ERGO' ? "🪑" : "🏃");
        
        area.onclick = () => {
            score++;
            if(score >= 5) finJeu();
        };
    }

    function finJeu() {
        document.getElementById('game-zone').style.display = 'none';
        document.getElementById('reveal').style.display = 'flex';
    }

    function montrerSexe() {
        document.getElementById('reveal').innerHTML = `
            <h2>C'EST UNE...</h2>
            <h1 style="color:#ff6b81">FILLE !</h1>
            <p style="font-size: 20px">🌸</p>
        `;
    }
</script>
</body>
</html>
