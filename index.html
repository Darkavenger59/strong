<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-STRONG</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --bg: #121212; --card: #1E1E1E; --text: #F5F5F5; --text-muted: #A0A0A5; --accent: #0A84FF; --danger: #FF453A; --success: #32D74B; }
        body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding-bottom: 90px; user-select: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        h1 { text-align: center; margin: 20px 0; font-size: 22px; font-weight: 700; }
        h2 { font-size: 18px; color: var(--text-muted); font-weight: 500; margin-bottom: 15px; }
        .view { display: none; padding: 20px; }
        .view.active { display: block; }
        .card { background: var(--card); padding: 18px; margin-bottom: 15px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-big { display: flex; align-items: center; justify-content: center; margin: 0 auto; width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, #0A84FF, #0055A4); color: white; border: none; font-size: 28px; font-weight: 800; cursor: pointer; }
        .btn-action { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; border: none; font-weight: 600; font-size: 16px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
        .btn-ghost { background: transparent; color: var(--text-muted); }
        input, select { background: #2C2C2E; border: none; color: white; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; outline: none; }
        .stepper-group { display: flex; align-items: center; justify-content: space-between; background: #2C2C2E; border-radius: 10px; padding: 5px; margin-bottom: 15px; }
        .stepper-btn { background: transparent; color: var(--accent); border: none; font-size: 24px; width: 45px; height: 45px; font-weight: bold; }
        .input-label { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; display: block; padding-left: 5px; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #333; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; }
        .nav-item.active { color: var(--accent); }
        
        /* Heatmap Styles */
        .heatmap { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 4px; width: max-content; margin: 0 auto; }
        .day { width: 12px; height: 12px; background-color: #161b22; border-radius: 3px; }
        .day[data-level="1"] { background-color: #0e4429; }
        .day[data-level="2"] { background-color: #006d32; }
        .day[data-level="3"] { background-color: #26a641; }
        .day[data-level="4"] { background-color: #39d353; }
        
        /* Numérotation série */
        .serie-num { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; border: 1px solid #444; color: #666; font-size: 12px; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div style="height:35vh; display:flex; align-items:center; justify-content:center;"><button class="btn-big" onclick="startWorkout()">GO</button></div>
        <div id="heatmap" class="heatmap"></div>
    </div>

    <div id="v-history" class="view">
        <h2>Historique</h2>
        <div id="hist-list"></div>
    </div>

    <div id="v-charts" class="view">
        <h2>Progression</h2>
        <div id="chart-list"></div>
    </div>

    <div id="v-workout" class="view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin:0; color:white;">Séance</h2>
            <span id="timer" style="color:var(--accent); font-weight:bold;">00:00</span>
        </div>
        <div class="card">
            <input type="text" id="w-name" list="dl" placeholder="Mouvement" oninput="updateExerciseStats()">
            <datalist id="dl"></datalist>
            <div id="exercise-stats" style="font-size: 12px; color: var(--accent); margin-top:10px; display: none; text-align: center;">
                Hier total: <span id="last-vol">0</span>kg | Aujourd'hui: <span id="cur-vol">0</span>kg
            </div>
            <div style="display:flex; gap:15px; margin-top:15px;">
                <div style="flex:1;"><label class="input-label">Poids (kg)</label><div class="stepper-group"><button class="stepper-btn" onclick="adjustWeightIndex(-1)">-</button><select id="w-kg" style="appearance:none; background:transparent; border:none; text-align:center; font-size:18px; font-weight:600;"></select><button class="stepper-btn" onclick="adjustWeightIndex(1)">+</button></div></div>
                <div style="flex:1;"><label class="input-label">Reps</label><div class="stepper-group"><button class="stepper-btn" onclick="adjustValue('w-reps', -1)">-</button><input type="number" id="w-reps" value="0" style="text-align:center; font-size:18px; font-weight:600;"><button class="stepper-btn" onclick="adjustValue('w-reps', 1)">+</button></div></div>
            </div>
            <button class="btn-action btn-primary" onclick="addSet()">Valider la série</button>
        </div>
        <ul id="w-list" style="list-style:none; padding:0;"></ul>
        <button class="btn-action btn-danger" onclick="saveWorkout()">Terminer la séance</button>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🏠 Accueil</div>
        <div class="nav-item" onclick="showTab('history', this)">📅 Historique</div>
        <div class="nav-item" onclick="showTab('charts', this)">📈 Progrès</div>
    </div>

    <script>
        var currentSession = [], allData = [], db = null;
        const firebaseConfig = { apiKey: "AIzaSyBuzNrrB-rK_xcjSeGtFc3I9yUKHhRUcIY", authDomain: "b-strong-4c3d1.firebaseapp.com", projectId: "b-strong-4c3d1", storageBucket: "b-strong-4c3d1.firebasestorage.app", messagingSenderId: "746501272062", appId: "1:746501272062:web:b2181766fd23ce8a3f10af" };
        firebase.initializeApp(firebaseConfig); db = firebase.firestore();

        window.showTab = (n, e) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-'+n).classList.add('active');
            if(n==='history') renderHistory();
        };

        function populateWeights() {
            var s = document.getElementById('w-kg');
            s.innerHTML = "";
            for(var i = 0; i <= 200; i += 2.5) s.innerHTML += `<option value="${i}">${i} kg</option>`;
            [2.3, 4.5, 6.8, 9.1, 11.3, 13.6, 15.8, 18.1, 20.4, 22.7].forEach(w => s.innerHTML += `<option value="${w}">${w} kg</option>`);
        }

        window.adjustWeightIndex = (d) => { var s = document.getElementById('w-kg'); s.selectedIndex = Math.max(0, Math.min(s.options.length - 1, s.selectedIndex + d)); };
        window.adjustValue = (id, a) => { var el = document.getElementById(id); el.value = Math.max(0, parseInt(el.value) + a); };

        window.updateExerciseStats = () => {
            var name = document.getElementById('w-name').value.toLowerCase();
            if(!name) return;
            var curVol = 0, lastVol = 0;
            currentSession.forEach(s => { if(s.nom.toLowerCase() === name) curVol += s.poids * s.reps; });
            var sorted = allData.sort((a,b) => b.date - a.date);
            var lastDate = null;
            for(var item of sorted) {
                var vol = 0;
                item.data.exercises.forEach(e => { if(e.nom.toLowerCase() === name) vol += e.poids * e.reps; });
                if(vol > 0) {
                    if(!lastDate) lastDate = item.date.toDateString();
                    if(item.date.toDateString() === lastDate) lastVol += vol;
                    else break;
                }
            }
            document.getElementById('exercise-stats').style.display = 'block';
            document.getElementById('last-vol').innerText = lastVol;
            document.getElementById('cur-vol').innerText = curVol;
        };

        window.addSet = () => {
            var name = document.getElementById('w-name').value;
            var poids = parseFloat(document.getElementById('w-kg').value);
            var reps = parseInt(document.getElementById('w-reps').value);
            currentSession.push({nom: name, poids, reps});
            var li = document.createElement('li');
            li.innerHTML = `<div class="card">${name} : ${poids}kg x ${reps}</div>`;
            document.getElementById('w-list').prepend(li);
            updateExerciseStats();
        };

        function renderHistory() {
            var div = document.getElementById('hist-list'); div.innerHTML = "";
            var groups = {};
            allData.forEach(item => {
                var dKey = item.date.toDateString();
                if(!groups[dKey]) groups[dKey] = {};
                item.data.exercises.forEach(ex => {
                    if(!groups[dKey][ex.nom]) groups[dKey][ex.nom] = [];
                    groups[dKey][ex.nom].push(ex);
                });
            });
            for(var date in groups) {
                var card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `<h3>${date}</h3>`;
                for(var exName in groups[date]) {
                    card.innerHTML += `<div style="margin-top:10px; font-weight:bold">${exName}</div>`;
                    groups[date][exName].forEach((s, i) => {
                        card.innerHTML += `<div style="padding:5px 0;"><span class="serie-num">${i+1}</span> ${s.poids}kg x ${s.reps}</div>`;
                    });
                }
                div.appendChild(card);
            }
        }

        function renderHeatmap() {
            var bests = {}, scores = {}, heatmap = document.getElementById('heatmap'); heatmap.innerHTML = '';
            allData.forEach(i => i.data.exercises.forEach(e => {
                var v = e.poids * e.reps, n = e.nom.toLowerCase();
                if(!bests[n] || v > bests[n]) bests[n] = v;
            }));
            allData.forEach(i => {
                var d = i.date.toISOString().split('T')[0], r = [];
                i.data.exercises.forEach(e => r.push((e.poids * e.reps) / bests[e.nom.toLowerCase()]));
                scores[d] = r.reduce((a,b) => a+b, 0) / r.length;
            });
            for(var j=0; j<365; j++) {
                var d = new Date(); d.setDate(d.getDate() - 364 + j);
                var k = d.toISOString().split('T')[0], s = scores[k], c = document.createElement('div');
                c.className = 'day'; if(s) c.dataset.level = s >= 1 ? "4" : s >= 0.75 ? "3" : s >= 0.5 ? "2" : "1";
                heatmap.appendChild(c);
            }
        }

        function loadData() { db.collection("workouts").get().then(snap => { allData = []; snap.forEach(doc => allData.push({data: doc.data(), date: doc.data().date.toDate()})); renderHeatmap(); }); }
        window.startWorkout = () => { showTab('workout'); populateWeights(); };
        loadData();
    </script>
</body>
</html>
