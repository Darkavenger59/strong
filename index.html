<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Reveal - L'Odyssée Hardcore</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 500px;
            background: linear-gradient(to bottom, #111e38, #2c3e50);
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(84, 160, 255, 0.4);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }

        #reveal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            display: none;
            z-index: 10;
        }

        #reveal-screen h2 {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #27ae60;
            margin-top: 15px;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">Colis : <span id="scoreVal">0</span>/5</div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div id="reveal-screen">
            <h2 id="reveal-text"></h2>
            <button class="btn" onclick="resetGame()">Rejouer</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const revealScreen = document.getElementById("reveal-screen");
        const revealText = document.getElementById("reveal-text");
        const scoreVal = document.getElementById("scoreVal");

        let isPlaying = true;
        let score = 0;
        const winningScore = 5; // Nombre de colis à attraper pour gagner

        let bird = {
            x: 80,
            y: 250,
            radius: 12,
            gravity: 0.4,
            lift: -6,
            velocity: 0
        };

        // Obstacles (Piliers haut et bas)
        let pipes = [];
        let pipeWidth = 50;
        let pipeGap = 140; // Espace serré pour la difficulté
        let pipeSpeed = 3;
        let frameCount = 0;

        window.addEventListener("keydown", (e) => { if (e.code === "Space") makeBirdFly(); });
        canvas.addEventListener("click", makeBirdFly);
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); makeBirdFly(); });

        function makeBirdFly() {
            if (!isPlaying) return;
            bird.velocity = bird.lift;
        }

        function spawnPipe() {
            let minHeight = 50;
            let maxHeight = canvas.height - pipeGap - 80;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function update() {
            if (!isPlaying) return;

            // Gravité
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Limites sol/plafond (mortels si on touche)
            if (bird.y + bird.radius >= canvas.height - 20 || bird.y - bird.radius <= 0) {
                gameOver();
            }

            // Génération des obstacles toutes les 90 frames
            frameCount++;
            if (frameCount % 90 === 0) {
                spawnPipe();
            }

            // Déplacement et gestion des obstacles
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                // Collision avec la cigogne
                if (
                    bird.x + bird.radius > pipes[i].x &&
                    bird.x - bird.radius < pipes[i].x + pipeWidth &&
                    (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom)
                ) {
                    gameOver();
                }

                // Compteur de score (quand on passe un tuyau)
                if (!pipes[i].passed && pipes[i].x < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreVal.innerText = score;

                    // Condition de victoire finale
                    if (score >= winningScore) {
                        triggerReveal();
                    }
                }

                // Supprimer les tuyaux sortis de l'écran
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            // Fond
            ctx.fillStyle = "#111e38";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin des obstacles (Style briques rétro)
            ctx.fillStyle = "#e67e22";
            pipes.forEach(pipe => {
                // Tuyau du Haut
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeStyle = "#d35400";
                ctx.lineWidth = 3;
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                // Tuyau du Bas
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });

            // Sol
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // Dessin de la Cigogne
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            // Bec
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(bird.x + bird.radius - 2, bird.y - 3, 8, 5);
        }

        function gameLoop() {
            update();
            draw();
            if (isPlaying) {
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            isPlaying = false;
            revealText.innerHTML = "OUPS ! CRASH...<br><br><span style='font-size: 12px; color: #e74c3c;'>La cigogne a lâché le colis.</span>";
            revealScreen.style.background = "rgba(0, 0, 0, 0.9)";
            revealScreen.style.display = "flex";
        }

        function triggerReveal() {
            isPlaying = false;
            // Modifie ici selon le sexe du bébé
            const babyGender = "GARÇON"; 
            
            if (babyGender === "FILLE") {
                revealText.innerHTML = "MISSION ACCOMPLIE !<br><br>C'est une <span style='color: #ff6b81;'>FILLE</span> ! 🌸";
                revealScreen.style.background = "rgba(255, 107, 129, 0.92)";
            } else {
                revealText.innerHTML = "MISSION ACCOMPLIE !<br><br>C'est un <span style='color: #54a0ff;'>GARÇON</span> ! 🚀";
                revealScreen.style.background = "rgba(84, 160, 255, 0.92)";
            }
            revealScreen.style.display = "flex";
        }

        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            scoreVal.innerText = score;
            frameCount = 0;
            revealScreen.style.display = "none";
            isPlaying = true;
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
